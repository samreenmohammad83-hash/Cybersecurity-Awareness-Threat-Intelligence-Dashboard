<!doctype html><html><head><meta charset="utf-8"><title>Threat Detail</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><header><div><h1>Threat Investigation View</h1><p>Local synthetic investigation record</p></div><nav><a href="/dashboard">Dashboard</a><a href="/awareness">Awareness</a></nav></header>
<main><section id="detail" class="panel"></section><section class="panel"><h2>Add Analyst Note</h2><textarea id="note" rows="4" maxlength="2000" placeholder="Document your defensive observation..."></textarea><button onclick="addNote()">Save note</button></section></main>
<script>
const id=location.pathname.split("/").pop();
async function load(){const r=await fetch("/api/threats/"+encodeURIComponent(id)); const d=await r.json(); if(d.error){document.querySelector("#detail").innerHTML="<h2>Not found</h2>";return;}
document.querySelector("#detail").innerHTML=`<h2>${esc(d.threat_name)}</h2><div class="kv">
<b>Threat ID</b><span>${esc(d.threat_id)}</span><b>Category</b><span>${esc(d.category)}</span><b>Indicator</b><span>${esc(d.indicator_value)}</span>
<b>Type</b><span>${esc(d.indicator_type)}</span><b>Severity</b><span>${esc(d.severity)}</span><b>Risk</b><span>${d.risk_score}/100</span>
<b>Confidence</b><span>${d.confidence_score}/100</span><b>Source</b><span>${esc(d.source_name)}</span><b>First Seen</b><span>${esc(d.first_seen)}</span><b>Last Seen</b><span>${esc(d.last_seen)}</span>
<b>Status</b><span>${esc(d.status)}</span><b>Description</b><span>${esc(d.description)}</span>
</div><h3>ATT&CK Mapping</h3><pre>${esc(JSON.stringify(d.attack_mapping,null,2))}</pre><h3>Related Indicators</h3><pre>${esc(JSON.stringify(d.related_indicators,null,2))}</pre><h3>Alerts</h3><pre>${esc(JSON.stringify(d.alerts,null,2))}</pre><h3>Analyst Notes</h3><pre>${esc(JSON.stringify(d.notes,null,2))}</pre>`;
}
async function addNote(){const note=document.querySelector("#note").value; await fetch("/api/threats/"+id+"/notes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({note})});document.querySelector("#note").value="";load();}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));} load();
</script></body></html>
